<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Не верь на слово 60+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap">
<style>
/* Одна колонка «как газета крупным шрифтом»: один шаг — один экран, большие кнопки во всю ширину */
:root{
  --paper:#F2F5F7; --card:#FFFFFF; --ink:#14212E; --muted:#4A5866; --line:#C7D1DA;
  --safe:#0E6B4F; --safe-ink:#FFFFFF; --safe-soft:#DDF0E8;
  --alarm:#A8261C; --alarm-soft:#FBE5E1; --gold:#9A6A00; --gold-soft:#FFF1CC;
  --display:'Literata', Georgia, 'Times New Roman', serif;
  --body:'Golos Text', 'Segoe UI', Arial, sans-serif;
  --fs:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1720; --card:#17222D; --ink:#EEF3F6; --muted:#A9B6C2; --line:#2E3E4C;
  --safe:#5BD1A4; --safe-ink:#08261C; --safe-soft:#123A2D; --alarm:#FF8F84; --alarm-soft:#3A1714;
  --gold:#F2C24F; --gold-soft:#3A2E0E; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0F1720; --card:#17222D; --ink:#EEF3F6; --muted:#A9B6C2; --line:#2E3E4C;
  --safe:#5BD1A4; --safe-ink:#08261C; --safe-soft:#123A2D; --alarm:#FF8F84; --alarm-soft:#3A1714;
  --gold:#F2C24F; --gold-soft:#3A2E0E; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
html{font-size:var(--fs)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1220px;margin:0 auto;padding-block:28px 72px;display:flex;flex-direction:column;gap:36px}
#app{display:flex;flex-direction:column;gap:28px}
.head{display:flex;flex-direction:column;gap:14px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 14px 6px 10px;margin-left:-10px;border-radius:12px;border:0;background:transparent;color:var(--safe);font-weight:600;font-size:1rem}
.back:hover{background:var(--safe-soft)}
.crumbs{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.crumbs .sep{width:1px;height:22px;background:var(--line)}
.crumbs .eyebrow{margin:0}
/* шаги урока — полоса прогресса из 4 частей */
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.prog .seg{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:48px;padding:6px 2px;margin:0;border:0;border-radius:10px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.prog .seg:hover span{color:var(--safe);text-decoration:underline}
.prog .seg.on{cursor:default}
.hint{margin:-4px 0 0;font-size:.82rem;color:var(--muted)}
.prog .seg.on:hover span{text-decoration:none;color:var(--ink)}
.prog .seg i{display:block;height:10px;border-radius:99px;background:var(--line)}
.prog .seg.done i{background:var(--safe)}
.prog .seg.on i{background:linear-gradient(90deg,var(--safe) 0 50%,color-mix(in srgb, var(--safe) 30%, var(--line)) 50%)}
.prog .seg span{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .seg.on span{color:var(--ink);font-weight:700}
.prog .seg.done span{color:var(--safe)}
.stack{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.25;letter-spacing:-.005em;margin:0;text-wrap:balance}
h1{font-size:1.8rem} h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:0}
a{color:var(--safe)}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:22px}
.brand{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.brand svg{width:44px;height:44px;flex:none}
.brand b{font-family:var(--display);font-size:1.2rem;line-height:1.3;text-wrap:balance}
.brand small{display:block;margin-top:4px;color:var(--muted);font-family:var(--body);font-size:.8rem;font-weight:500}
.tools{display:flex;gap:8px}
.sbtn{min-height:52px;min-width:56px;padding:6px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.stars{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:6px 14px;font-weight:700}
.stars svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,36px);display:flex;flex-direction:column;gap:20px;box-shadow:0 1px 2px color-mix(in srgb, var(--ink) 6%, transparent)}
.lead{font-size:1.1rem;line-height:1.6;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;padding:14px 24px;border-radius:18px;border:2px solid var(--safe);background:var(--safe);color:var(--safe-ink);font-weight:600;font-size:1.1rem;text-align:center}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.alarm{background:var(--alarm);border-color:var(--alarm);color:#FFFFFF}
.btn svg{width:24px;height:24px;flex:none}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row > *{flex:1 1 220px}
.lesson{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;color:var(--ink);min-height:92px}
.lesson .num{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;background:var(--paper);border:2px solid var(--line)}
.lesson.done .num{background:var(--safe);color:var(--safe-ink);border-color:var(--safe)}
.lesson .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lesson .t b{font-size:1.1rem;font-weight:600}
.lesson .t span{color:var(--muted);font-size:.95rem}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--alarm-soft);color:var(--alarm)}
.tag.ok{background:var(--safe-soft);color:var(--safe)}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.steps{display:flex;gap:10px;flex-wrap:wrap}
.steps span{font-size:.85rem;padding:6px 14px;border-radius:999px;border:2px solid var(--line);color:var(--muted)}
.steps span.on{border-color:var(--safe);background:var(--safe);color:var(--safe-ink);font-weight:600}
/* видео-сюжет */
.screen{background:var(--ink);color:var(--paper);border-radius:22px;padding:clamp(28px,6vw,48px) clamp(22px,5vw,40px);display:flex;flex-direction:column;justify-content:center;gap:28px;min-height:340px}
.screen .pic{display:flex;justify-content:center}
.screen .pic svg{width:112px;height:112px}
.screen .cap{font-size:1.3rem;line-height:1.55;text-align:center;max-width:30ch;margin:0 auto;text-wrap:balance}
.player{position:relative;padding:clamp(24px,5vw,40px) clamp(18px,4vw,32px) 18px;gap:22px;min-height:0}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;min-height:230px;cursor:pointer;animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ctrl{display:flex;align-items:center;gap:10px}
@media (min-width: 700px){ .player{aspect-ratio:16/9} .player .pic svg{width:128px;height:128px} .player .cap{font-size:1.5rem;max-width:32ch} }
.ctrl button{flex:none;width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;background:color-mix(in srgb, var(--paper) 14%, transparent);color:var(--paper)}
.ctrl button.main{width:60px;height:60px;background:var(--paper);color:var(--ink)}
.ctrl button svg{width:24px;height:24px}
.ctrl button:disabled{opacity:.3;cursor:default}
.ctrl .bar{flex:1;min-width:40px}
.ctrl .t{flex:none;font-size:.85rem;opacity:.8;font-variant-numeric:tabular-nums}
.bigplay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:0;border-radius:inherit;background:var(--ink);color:var(--paper);font:inherit;cursor:pointer}
.bigplay .c{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;background:var(--safe);color:var(--safe-ink);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s}
.bigplay:hover .c{transform:scale(1.06)}
.bigplay .c svg{width:46px;height:46px;margin-left:6px}
.bigplay .l{font-size:1.25rem;font-weight:600}
.bigplay .d{font-size:.9rem;opacity:.8}
.screen.real{padding:0;min-height:0;overflow:hidden}
.screen.real video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb, var(--paper) 25%, transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.meta{color:var(--muted);font-size:.9rem;text-align:center}
/* вопросы */
.opts{display:flex;flex-direction:column;gap:14px}
.opt{width:100%;text-align:left;min-height:68px;padding:16px 22px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:1.05rem;font-weight:500;line-height:1.45}
.opt.right{border-color:var(--safe);background:var(--safe-soft)}
.opt.wrong{border-color:var(--alarm);background:var(--alarm-soft)}
.fb{border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.fb.good{background:var(--safe-soft)} .fb.bad{background:var(--alarm-soft)}
.fb b{font-size:1.15rem}
/* телефон */
.phone{max-width:420px;width:100%;margin:0 auto;background:var(--ink);color:var(--paper);border-radius:34px;padding:28px 22px;display:flex;flex-direction:column;gap:18px;border:6px solid color-mix(in srgb, var(--ink) 70%, var(--line))}
.phone .who{text-align:center;display:flex;flex-direction:column;gap:2px}
.phone .who b{font-family:var(--display);font-size:1.3rem}
.phone .who span{opacity:.75;font-size:.9rem}
.bubble{background:color-mix(in srgb, var(--paper) 12%, var(--ink));border-radius:18px 18px 18px 4px;padding:14px 18px;font-size:1.05rem;line-height:1.5}
.ring{display:flex;gap:14px}
.ring button{flex:1;min-height:72px;border-radius:999px;border:0;font-weight:700;font-size:1.05rem}
.ring .yes{background:#1E9E62;color:#FFFFFF} .ring .no{background:#D93A2F;color:#FFFFFF}
.end{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.end > svg,.end > span > svg{width:84px;height:84px}
.memo{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:12px;line-height:1.55}
.memo li::marker{color:var(--safe)}
.rule{font-family:var(--display);font-size:1.3rem;line-height:1.3;border-left:5px solid var(--safe);padding:8px 0 8px 22px;text-align:left}
/* истории */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{display:inline-flex;gap:6px;align-items:center;min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:.9rem}
.chips a span{color:var(--muted)}
.chips a:hover{border-color:var(--safe);color:var(--safe)}
.case{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;color:var(--ink)}
.case .d{color:var(--muted);font-size:.9rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.story{font-size:1.1rem;line-height:1.65}
.src{font-size:.9rem;color:var(--muted)}
/* семья */
.check{display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:32px;height:32px;flex:none;accent-color:var(--safe);margin-top:2px}
.check small{display:block;margin-top:4px;color:var(--muted);font-size:.9rem;line-height:1.5}
.copybox{width:100%;min-height:140px;font:inherit;font-size:.95rem;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);color:var(--ink)}
.cert{border:4px double var(--gold);border-radius:22px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:16px;background:var(--card)}
.cert .nm{font-family:var(--display);font-size:1.6rem}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
.field input{font:inherit;min-height:56px;border-radius:12px;border:2px solid var(--line);padding:8px 14px;background:var(--card);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--paper);padding:14px 22px;border-radius:16px;font-weight:700;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* ---------- каркас: панель уроков слева + содержимое ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;align-items:start}
#app{width:100%;max-width:880px;min-width:0;margin-inline:auto}
.side{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.side .close{align-self:flex-end}
.sprog{display:flex;flex-direction:column;gap:10px;padding-inline:6px}
.sprog .r{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sprog .pbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.sprog .pbar i{display:block;height:100%;background:var(--safe);border-radius:99px}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:58px;padding:8px 10px;border-radius:14px;border:0;background:transparent;color:var(--ink);font-size:.92rem;line-height:1.3}
.nav button:hover{background:var(--paper)}
.nav button[aria-current="page"]{background:var(--safe-soft);font-weight:600}
.nav .n{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-size:.95rem}
.nav .n svg{width:18px;height:18px}
.nav .done .n{background:var(--safe);border-color:var(--safe);color:var(--safe-ink)}
.nav .lock button{color:var(--muted)}
.nav .t2{display:flex;flex-direction:column;gap:3px;min-width:0}
.nav .t2 small{font-size:.78rem;color:var(--muted);font-weight:400}
.side hr{border:0;border-top:1px solid var(--line);margin:0 6px}
.menu-btn{display:inline-flex;align-items:center;gap:8px}
.menu-btn svg{width:22px;height:22px}
.backdrop{position:fixed;inset:0;z-index:25;background:rgba(10,20,30,.5)}
@media (min-width: 1000px){
  .layout{grid-template-columns:290px minmax(0,1fr)}
  .side{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto}
  .side .close,.menu-btn,.backdrop{display:none!important}
}
@media (max-width: 999px){
  .side{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(88vw,360px);overflow:auto;border-radius:0 22px 22px 0;
    padding-top:calc(18px + env(safe-area-inset-top, 0px));padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));
    transform:translateX(-105%);visibility:hidden;transition:transform .25s ease, visibility 0s .25s;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .side.open{transform:none;visibility:visible;transition:transform .25s ease}
}
@media (max-width: 420px){ .menu-btn span{display:none} }
/* ---------- курс пройден ---------- */
.hero-done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:8px}
.medal{width:124px;height:124px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);border:4px solid var(--gold);animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.medal svg{width:66px;height:66px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.hero-done h1{font-size:clamp(1.6rem,4.5vw,2.3rem)}
.hero-done .lead{max-width:40ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px}
.tile b{font-family:var(--display);font-size:2.3rem;line-height:1;color:var(--safe)}
.tile.gold b{color:var(--gold)}
.tile span{color:var(--muted);font-size:.9rem;line-height:1.35}
.rules{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:14px}
.rules li{padding-left:6px;line-height:1.55}
.rules li::marker{font-family:var(--display);font-weight:700;color:var(--safe)}
.cert .ct{font-family:var(--display);font-size:clamp(1.5rem,4vw,2rem);line-height:1.2}
.cert .small{color:var(--muted);font-size:.9rem}
.cert .nm{color:var(--safe);border-bottom:1px solid var(--line);padding-bottom:10px;margin-inline:auto;min-width:min(100%,320px)}
.cfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:14px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-24px;width:10px;height:16px;border-radius:2px;animation:fall 3.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
@media (max-width: 560px){
  .wrap{padding-block:14px 56px;gap:20px}
  #app{gap:20px}
  .top{padding-bottom:12px;gap:10px}
  .brand{gap:10px}
  .brand svg{width:34px;height:34px}
  .brand b{font-size:.95rem;line-height:1.2}
  .tools{gap:6px}
  .prog .ck{display:none}
  h2{font-size:1.25rem}
  .rule{font-size:1.15rem}
  .card{padding:20px;gap:16px}
  .phone{padding:22px 14px;border-width:4px;border-radius:28px}
  .brand small{display:none}
  .sbtn{min-height:48px;min-width:46px;padding:6px 10px}
  .head{gap:8px}
  .prog .seg span{font-size:.72rem}
  .prog{gap:5px}
  h1{font-size:1.4rem}
  .back{min-height:46px;font-size:.9rem}
  .steps{gap:6px}
  .steps span{font-size:.75rem;padding:4px 10px}
  .stage{min-height:200px}
  .ctrl{gap:8px}
  .ctrl button{width:46px;height:46px}
  .ctrl button.main{width:54px;height:54px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand" id="home-link" role="button" tabindex="0" aria-label="На главную">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4 L40 10 V22 C40 33 33 41 24 44 C15 41 8 33 8 22 V10 Z" fill="var(--safe)"/><path d="M16 24 L22 30 L33 18" stroke="var(--safe-ink)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>Не верь на слово<small>Защита от мошенников · 60+</small></b>
    </div>
    <div class="tools">
      <button class="sbtn menu-btn" id="menu" type="button" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>Уроки</span></button>
      <button class="sbtn" id="fs-minus" type="button" aria-label="Уменьшить шрифт">А−</button>
      <button class="sbtn" id="fs-plus" type="button" aria-label="Увеличить шрифт">А+</button>
    </div>
  </header>
  <div class="layout">
    <aside class="side" id="side" aria-label="Уроки курса"></aside>
    <main id="app" aria-live="polite"></main>
  </div>
</div>
<div class="backdrop" id="backdrop" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>

const PRAISE = ['Отлично! Вас так просто не проведёшь.','Верно! Вы рассуждаете как опытный следователь.','Прекрасно! Именно так и нужно поступать.','Браво! Мошенники остались ни с чем.','Совершенно верно! Так держать.'];

/* ---------- сохранение (только на этом устройстве) ---------- */
const KEY = 'nvns60';
let ST = {stars:0, done:{}, q:{}, calls:{}, cases:{}, fam:{}, name:'', fs:21};
try { Object.assign(ST, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (_) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (_) {} }
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const praise = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];
/* случайный порядок вариантов, чтобы правильный ответ не стоял всегда на одном месте */
function mix(n){ const a = Array.from({length: n}, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { el.hidden = true; }, 2600); }
function star(n){ ST.stars += n; save(); renderSide(); toast(`+${n} ${n === 1 ? 'звезда' : 'звезды'} бдительности`); }
function starsPill(){ return `<span class="stars">${IC.star} ${ST.stars}</span>`; }

/* ---------- озвучка ---------- */
const TTS = 'speechSynthesis' in window;
function voice(){ try { return speechSynthesis.getVoices().find(v => /^ru/i.test(v.lang)); } catch (_) { return null; } }
function say(text, onend){
  if (!TTS) { if (onend) setTimeout(onend, Math.max(5000, text.length * 70)); return; }
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ru-RU'; u.rate = .92; const v = voice(); if (v) u.voice = v; if (onend) u.onend = onend; speechSynthesis.speak(u); }
  catch (_) { if (onend) setTimeout(onend, Math.max(5000, text.length * 70)); }
}
function hush(){ try { if (TTS) speechSynthesis.cancel(); } catch (_) {} spkStop(); }
/* «Прочитать вслух»: сначала записи голоса автора (если есть), иначе синтез браузера. Повторное нажатие — пауза, ещё раз — продолжить */
const AUDIO_DIR = 'audio/';
function speakBtn(text, clips){ return `<button class="btn ghost" type="button" data-say="${esc(text)}" ${clips && clips.length ? `data-clips="${esc(clips.join('|'))}"` : ''}>${IC.speak} Прочитать вслух</button>`; }
function bindSpeak(){ app.querySelectorAll('[data-say]').forEach(b => b.onclick = () => spkToggle(b)); }
const SPK = {btn: null, audio: null, list: [], i: 0, state: 'idle', tts: false};
function spkLabel(b, st){ if (b) b.innerHTML = st === 'play' ? `${IC.pause} Пауза` : st === 'paused' ? `${IC.play} Продолжить` : `${IC.speak} Прочитать вслух`; }
function spkStop(){
  if (SPK.audio) { try { SPK.audio.pause(); } catch (_) {} SPK.audio.onended = SPK.audio.onerror = null; SPK.audio = null; }
  if (SPK.tts) { try { speechSynthesis.cancel(); } catch (_) {} }
  spkLabel(SPK.btn, 'idle'); SPK.btn = null; SPK.state = 'idle'; SPK.tts = false;
}
function spkDone(){ spkLabel(SPK.btn, 'idle'); SPK.btn = null; SPK.audio = null; SPK.state = 'idle'; SPK.tts = false; }
function spkTts(text){
  SPK.tts = true;
  if (!TTS) { spkDone(); toast('Озвучка недоступна на этом устройстве'); return; }
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ru-RU'; u.rate = .92; const v = voice(); if (v) u.voice = v;
    const me = SPK.btn; u.onend = () => { if (SPK.btn === me && SPK.state === 'play') spkDone(); }; speechSynthesis.speak(u); } catch (_) { spkDone(); }
}
function spkNext(){
  if (SPK.i >= SPK.list.length) { spkDone(); return; }
  const a = new Audio(AUDIO_DIR + SPK.list[SPK.i]); SPK.audio = a;
  a.onended = () => { SPK.i++; spkNext(); };
  a.onerror = () => { const text = SPK.btn ? SPK.btn.dataset.say : ''; SPK.audio = null; spkTts(text); };  // нет записи — читаем синтезом
  try { const pr = a.play(); if (pr && pr.catch) pr.catch(() => a.onerror && a.onerror()); } catch (_) { a.onerror(); }
}
function spkToggle(b){
  if (SPK.btn === b && SPK.state === 'play') {
    if (SPK.audio) SPK.audio.pause(); else try { speechSynthesis.pause(); } catch (_) {}
    SPK.state = 'paused'; spkLabel(b, 'paused'); return;
  }
  if (SPK.btn === b && SPK.state === 'paused') {
    if (SPK.audio) { try { const pr = SPK.audio.play(); if (pr && pr.catch) pr.catch(() => {}); } catch (_) {} } else try { speechSynthesis.resume(); } catch (_) {}
    SPK.state = 'play'; spkLabel(b, 'play'); return;
  }
  hush();
  SPK.btn = b; SPK.state = 'play'; spkLabel(b, 'play');
  const clips = b.dataset.clips ? b.dataset.clips.split('|') : [];
  if (clips.length) { SPK.list = clips; SPK.i = 0; spkNext(); } else spkTts(b.dataset.say);
}

function applyFs(){ document.documentElement.style.setProperty('--fs', ST.fs + 'px'); }
$('#fs-plus').onclick = () => { ST.fs = Math.min(28, ST.fs + 2); applyFs(); save(); };
$('#fs-minus').onclick = () => { ST.fs = Math.max(17, ST.fs - 2); applyFs(); save(); };
$('#home-link').onclick = () => go('');
$('#home-link').onkeydown = e => { if (e.key === 'Enter') go(''); };
applyFs();

/* ---------- главная ---------- */
function home(){
  hush();
  const n = LESSONS.filter(l => ST.done[l.id]).length;
  const nextL = LESSONS.find(l => !ST.done[l.id]);
  const fresh = CASES.filter(c => c.new && !ST.cases[c.id]).length;
  const askName = !(ST.name || '').trim() && !ST.skipName;
  app.innerHTML = `
  ${askName ? `<section class="card" id="name-card">

function fmtDate(iso){ try { return new Date(iso).toLocaleDateString('ru-RU', {day:'numeric', month:'long'}); } catch (_) { return iso; } }
function bindGo(){ app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go)); }
function go(where){ try { history.replaceState(null, '', where ? '#' + where : location.pathname); } catch (_) {} routeNav(where || ''); window.scrollTo(0, 0); }

/* ---------- урок: видео → вопросы → звонок → итог ---------- */
const STEP_NAMES = ['Видео', 'Вопросы', 'Практика', 'Итог'];
/* шаги урока — можно перейти на любой: пропустить видео, вернуться к нему после вопросов */
let CUR_L = null;
function stepsBar(i){ return `<nav class="prog" aria-label="Шаги урока: сейчас ${i + 1} из ${STEP_NAMES.length}, ${STEP_NAMES[i]}">${STEP_NAMES.map((s, k) => `<button type="button" class="seg ${k < i ? 'done' : k === i ? 'on' : ''}" data-step="${k}" ${k === i ? 'aria-current="step"' : ''}><i></i><span>${k < i ? '<b class="ck">✓ </b>' : ''}${s}</span></button>`).join('')}</nav><p class="hint">Можно нажать на любой шаг: например, сразу перейти к вопросам или вернуться к видео.</p>`; }
function goStep(k){
  const L = CUR_L; if (!L) return;
  hush();
  if (k === 0) video(L); else if (k === 1) quiz(L, 0); else if (k === 2) (L.family ? family(L) : call(L)); else finish(L);
  window.scrollTo(0, 0);
}
app.addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b && !b.classList.contains('on')) goStep(+b.dataset.step); });
function lessonHead(L, i){ CUR_L = L; return `<div class="head"><div class="crumbs"><button class="back" type="button" data-go="">← Все уроки</button><span class="sep" aria-hidden="true"></span><p class="eyebrow">Урок ${LESSONS.indexOf(L) + 1} из ${LESSONS.length}</p></div><h1>${esc(L.title)}</h1>${stepsBar(i)}</div>`; }

function video(L){
  hush();
  /* Настоящий ролик (когда появится): L.mp4 — путь к файлу, L.poster — картинка-обложка */
  if (L.mp4) {
    app.innerHTML = `${lessonHead(L, 0)}
    <div class="stack"><section class="screen real"><video src="${esc(L.mp4)}" ${L.poster ? `poster="${esc(L.poster)}"` : ''} controls playsinline preload="metadata"></video></section>
    <p class="meta">Нажмите ▶ в центре видео. Звук можно сделать громче кнопками на телефоне.</p></div>
    <button class="btn" type="button" id="v-done">К вопросам →</button>`;
    bindGo(); $('#v-done').onclick = () => quiz(L, 0); return;
  }
  let k = 0, playing = false, started = false, seen = false;
  const N = L.video.length;
  const ICP = {
    prev:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5 9 12l10 7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    next:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l10 7-10 7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'};
  const paint = () => {
    const [ic, text] = L.video[k];
    if (k === N - 1) seen = true;
    app.innerHTML = `${lessonHead(L, 0)}
    <div class="stack">
    <section class="screen player" aria-label="Видеосюжет">
      <div class="stage" id="v-stage">
        <div class="pic">${IC[ic]}</div>
        <p class="cap">${esc(text)}</p>
      </div>
      <div class="ctrl">
        <button type="button" id="v-prev" aria-label="Предыдущий кадр" ${k ? '' : 'disabled'}>${ICP.prev}</button>
        <button type="button" class="main" id="v-play" aria-label="${playing ? 'Пауза' : 'Смотреть'}">${playing ? IC.pause : IC.play}</button>
        <button type="button" id="v-next" aria-label="Следующий кадр" ${k < N - 1 ? '' : 'disabled'}>${ICP.next}</button>
        <div class="bar" aria-hidden="true"><i style="width:${(k + 1) / N * 100}%"></i></div>
        <span class="t">${k + 1} / ${N}</span>
      </div>
      ${started ? '' : `<button type="button" class="bigplay" id="v-big"><span class="c">${IC.play}</span><span class="l">Смотреть со звуком</span><span class="d">${N} кадров · около ${Math.max(1, Math.round(N * 20 / 60))} мин</span></button>`}
    </section>
    ${TTS ? '' : '<p class="meta">Озвучка недоступна на этом устройстве — читайте текст на экране.</p>'}
    </div>
    ${seen ? '<button class="btn" type="button" id="v-done">К вопросам →</button>' : ''}`;
    bindGo();
    const toggle = () => { started = true; playing = !playing; if (playing) speakNow(); else hush(); paint(); };
    $('#v-play').onclick = toggle;
    $('#v-stage').onclick = toggle;
    const big = $('#v-big'); if (big) big.onclick = toggle;
    $('#v-prev').onclick = () => { started = true; k = Math.max(0, k - 1); if (playing) speakNow(); paint(); };
    $('#v-next').onclick = () => { started = true; k = Math.min(N - 1, k + 1); if (playing) speakNow(); paint(); };
    const dn = $('#v-done'); if (dn) dn.onclick = () => { hush(); quiz(L, 0); };
  };
  const speakNow = () => { const here = k; say(L.video[k][1], () => { if (!playing || here !== k) return; if (k < N - 1) { k++; paint(); speakNow(); } else { playing = false; paint(); } }); };
  paint();
}

function quiz(L, qi){
  hush();

  app.innerHTML = `${lessonHead(L, 1)}
  <section class="card">

    ${speakBtn(Q.q + '. Варианты: ' + order.map(j => Q.o[j]).join('. '), [`q-${L.id}-${qi}.mp3`, 'variants.mp3', ...order.map(j => `q-${L.id}-${qi}-o${j}.mp3`)])}

      <button class="btn" type="button" id="q-next">${qi < L.quiz.length - 1 ? 'Следующий вопрос →' : (L.family ? 'К семейному договору →' : 'К тренировке «звонок» →')}</button>`;

function call(L){

/* «мошенник» называет пользователя по имени — так видно, что знание ваших данных ничего не доказывает */
const userName = () => (ST.name || '').trim() || 'Галина Ивановна';
const withName = t => t.replace(/\{name\}/g, userName());
function node(L, id){
  const N0 = L.call.nodes[id];

  ph.querySelectorAll('[data-to]').forEach(b => b.onclick = () => { hush(); node(L, b.dataset.to); });

function callEnd(L, N){

}

  const n = LESSONS.filter(l => ST.done[l.id]).length, fresh = CASES.filter(c => c.new && !ST.cases[c.id]).length, all = allDone();
  side.innerHTML = `<button class="sbtn close" id="side-x" type="button">✕ Закрыть</button>
  <div class="sprog"><p class="eyebrow">Ваш прогресс</p>
    <div class="r"><b>Пройдено ${n} из ${LESSONS.length}</b>${starsPill()}</div>
    <div class="pbar" aria-hidden="true"><i style="width:${n / LESSONS.length * 100}%"></i></div></div>
  <ul class="nav">
    <li><button type="button" data-nav="" ${NAV === '' ? 'aria-current="page"' : ''}><span class="n">${IC.home}</span><span class="t2">Главная</span></button></li>
    ${LESSONS.map((l, i) => `<li class="${ST.done[l.id] ? 'done' : ''}"><button type="button" data-nav="${l.id}" ${NAV === l.id ? 'aria-current="page"' : ''}><span class="n">${ST.done[l.id] ? '✓' : i + 1}</span><span class="t2">${esc(l.title)}${ST.done[l.id] ? '<small>Пройден</small>' : ''}</span></button></li>`).join('')}
  </ul>
  <hr>
  <ul class="nav">
    <li><button type="button" data-nav="cases" ${NAV === 'cases' ? 'aria-current="page"' : ''}><span class="n">${IC.badge}</span><span class="t2">Реальные истории${fresh ? `<small>Новых: ${fresh}</small>` : ''}</span></button></li>
    <li class="${all ? 'done' : 'lock'}"><button type="button" data-nav="cert" ${NAV === 'cert' ? 'aria-current="page"' : ''}><span class="n">${IC.star}</span><span class="t2">Свидетельство<small>${all ? 'Курс пройден!' : 'Откроется после всех уроков'}</small></span></button></li>
  </ul>`;
  side.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { closeSide(); go(b.dataset.nav); });
  $('#side-x').onclick = closeSide;
}
function openSide(){ $('#side').classList.add('open'); $('#backdrop').hidden = false; $('#menu').setAttribute('aria-expanded', 'true'); const x = $('#side-x'); if (x) x.focus(); }
function closeSide(){ const sd = $('#side'); if (!sd.classList.contains('open')) return; sd.classList.remove('open'); $('#backdrop').hidden = true; $('#menu').setAttribute('aria-expanded', 'false'); $('#menu').focus(); }

/* ---------- курс пройден: поздравление и свидетельство ---------- */
function confetti(){
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (_) {}
  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
  const colors = ['var(--safe)', 'var(--gold)', 'var(--alarm)', '#4C8DF6', 'var(--safe-soft)'];
  box.innerHTML = Array.from({length: 70}, (_, i) => `<i style="left:${Math.random() * 100}%;background:${colors[i % colors.length]};animation-delay:${Math.random() * 1.2}s;transform:rotate(${Math.random() * 180}deg)"></i>`).join('');
  document.body.appendChild(box); setTimeout(() => box.remove(), 5000);
}
const gradDate = () => new Date(ST.grad || Date.now()).toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
function cert(){
  hush();
  const n = LESSONS.filter(l => ST.done[l.id]).length;
  if (n < LESSONS.length) {
    const nx = LESSONS.find(l => !ST.done[l.id]);
    app.innerHTML = `<section class="card end">${IC.star.replace('<svg', '<svg style="width:72px;height:72px;color:var(--gold)"')}<h2>Свидетельство ждёт вас</h2><p class="lead">Оно откроется, когда вы пройдёте все уроки. Сейчас пройдено ${n} из ${LESSONS.length}.</p><button class="btn" type="button" data-go="${nx.id}">${IC.play} Продолжить: ${esc(nx.title)}</button></section>`;
    bindGo(); return;
  }
  congrats();
}
function congrats(){
  hush(); renderSide('cert');
  const first = !ST.grad;
  if (first) { ST.grad = new Date().toISOString(); save(); }
  const calls = Object.keys(ST.calls).length, cs = Object.keys(ST.cases).length;
  const link = 'https://moteam-design.github.io/ne-ver-60/';
  const share = `Курс «Не верь на слово» пройден! Теперь я знаю, как распознать мошенников и что делать, если звонят «из банка» или «из полиции». Пройдите и вы — это бесплатно: ${link}`;
  app.innerHTML = `
  <section class="hero-done">
    <div class="medal">${IC.shield}</div>
    <p class="eyebrow">Курс пройден</p>
    <h1>Поздравляем! Вы прошли весь курс</h1>
    <p class="lead">Теперь вы знаете приёмы мошенников и умеете вовремя положить трубку. Это защищает и вас, и ваших близких.</p>
  </section>
  <div class="tiles">
    <div class="tile"><b>${LESSONS.length}</b><span>уроков пройдено</span></div>
    <div class="tile gold"><b>${ST.stars}</b><span>звёзд бдительности</span></div>
    <div class="tile"><b>${calls}</b><span>звонков мошенников распознано</span></div>
    <div class="tile"><b>${cs}</b><span>реальных историй разобрано</span></div>
  </div>
  <section class="card"><h2>Ваши главные правила</h2>
    <ol class="rules">${LESSONS.map(l => `<li>${esc(l.rule)}</li>`).join('')}</ol>
    ${speakBtn(LESSONS.map(l => l.rule).join(' '))}</section>
  <section class="stack" id="cert-sec">
    <h2>Ваше свидетельство</h2>
    <label class="field" for="nm">Впишите имя — оно появится в свидетельстве<input id="nm" type="text" maxlength="40" autocomplete="name" value="${esc(ST.name)}" placeholder="Например: Галина Ивановна"></label>
    <section class="cert">
      ${IC.shield.replace('<svg', '<svg style="width:72px;height:72px;margin:0 auto"')}
      <p class="eyebrow">Свидетельство о прохождении курса</p>
      <p class="ct">«Не верь на слово»</p>
      <p class="small">Защита от мошенников · 60+</p>
      <p class="small">выдано</p>
      <p class="nm" id="nm-out">${esc(ST.name || 'Ваше имя')}</p>
      <p>за успешное прохождение всех ${LESSONS.length} уроков курса</p>
      <div class="cfoot"><span>${esc(gradDate())}</span><span>Звёзд бдительности: ${ST.stars}</span></div>
    </section>
    <button class="btn" type="button" id="dl">Скачать свидетельство (картинка)</button>
    <p class="meta">Или просто сфотографируйте экран и покажите родным.</p>
  </section>
  <section class="card"><h2>Расскажите родным и друзьям</h2>
    <p>Мошенники звонят всем. Отправьте это сообщение тем, кого хотите защитить.</p>
    <textarea class="copybox" id="inv" readonly>${esc(share)}</textarea>
    <button class="btn ghost" type="button" id="copy">Скопировать сообщение</button></section>
  <div class="actions"><button class="btn ghost" type="button" data-go="cases">Тренироваться дальше на новых историях</button></div>`;
  bindGo(); bindSpeak();
  $('#nm').oninput = e => { ST.name = e.target.value; save(); $('#nm-out').textContent = ST.name || 'Ваше имя'; };
  $('#copy').onclick = () => { const ta = $('#inv');
    try { navigator.clipboard.writeText(ta.value).then(() => toast('Скопировано. Вставьте в сообщение'), () => { ta.select(); toast('Выделите текст и скопируйте'); }); }
    catch (_) { ta.select(); toast('Выделите текст и скопируйте'); } };
  $('#dl').onclick = async () => {
    if (!ST.name.trim()) { $('#nm').focus(); toast('Сначала впишите имя'); return; }
    try { const a = document.createElement('a'); a.href = await certPng(); a.download = 'Свидетельство - Не верь на слово.png'; document.body.appendChild(a); a.click(); a.remove(); toast('Свидетельство сохраняется в папку «Загрузки»'); }
    catch (_) { toast('Не получилось сохранить — сфотографируйте экран'); }
  };
  if (first) confetti();
}
async function certPng(){
  try { await Promise.all(['700 80px Literata', '600 30px "Golos Text"', '400 30px "Golos Text"'].map(f => document.fonts.load(f))); } catch (_) {}
  const W = 1754, H = 1240, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), SERIF = 'Literata, Georgia, serif', SANS = '"Golos Text", Arial, sans-serif';
  x.fillStyle = '#FFFDF6'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#9A6A00'; x.lineWidth = 10; x.strokeRect(50, 50, W - 100, H - 100); x.lineWidth = 3; x.strokeRect(80, 80, W - 160, H - 160);
  x.save(); x.translate(W / 2 - 60, 140); x.scale(2.5, 2.5);
  x.fillStyle = '#0E6B4F'; x.fill(new Path2D('M24 4 L40 10 V22 C40 33 33 41 24 44 C15 41 8 33 8 22 V10 Z'));
  x.strokeStyle = '#FFFFFF'; x.lineWidth = 4; x.lineCap = 'round'; x.lineJoin = 'round'; x.stroke(new Path2D('M16 24 L22 30 L33 18')); x.restore();
  x.textAlign = 'center';
  x.fillStyle = '#4A5866'; x.font = `600 30px ${SANS}`; x.fillText('СВИДЕТЕЛЬСТВО О ПРОХОЖДЕНИИ КУРСА', W / 2, 340);
  x.fillStyle = '#14212E'; x.font = `700 84px ${SERIF}`; x.fillText('«Не верь на слово»', W / 2, 450);
  x.fillStyle = '#4A5866'; x.font = `400 34px ${SANS}`; x.fillText('Защита от мошенников · 60+', W / 2, 510);
  x.font = `400 30px ${SANS}`; x.fillText('выдано', W / 2, 615);
  const name = ST.name.trim(); let fs = 96;
  do { x.font = `700 ${fs}px ${SERIF}`; } while (x.measureText(name).width > W - 360 && (fs -= 4) > 40);
  x.fillStyle = '#0E6B4F'; x.fillText(name, W / 2, 725);
  x.strokeStyle = '#C7D1DA'; x.lineWidth = 2; x.beginPath(); x.moveTo(W / 2 - 440, 765); x.lineTo(W / 2 + 440, 765); x.stroke();
  x.fillStyle = '#14212E'; x.font = `400 38px ${SANS}`;
  x.fillText(`за успешное прохождение всех ${LESSONS.length} уроков курса`, W / 2, 850);
  x.fillText('и умение распознать мошенников', W / 2, 905);
  x.fillStyle = '#4A5866'; x.font = `600 30px ${SANS}`;
  x.textAlign = 'left'; x.fillText(gradDate(), 190, 1090);
  x.textAlign = 'right'; x.fillText(`Звёзд бдительности: ${ST.stars}`, W - 190, 1090);
  return c.toDataURL('image/png');
}

/* ---------- маршруты ---------- */
function route(h){
  h = h == null ? location.hash.slice(1) : h;
  const L = LESSONS.find(l => l.id === h);
  if (L) return video(L);
  if (h === 'cases') return cases();
  if (h === 'cert') return cert();
  home();
}
function routeNav(h){ h = h == null ? location.hash.slice(1) : h; route(h); renderSide(h); }
/* свежие истории из файла cases.json рядом со страницей (если есть) */
fetch('cases.json?t=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(d => {
  if (d && Array.isArray(d.cases) && d.cases.length) { CASES = d.cases; CASES_UPDATED = d.updated || CASES_UPDATED; if (!location.hash || location.hash === '#cases') routeNav(); else renderSide(); }
}).catch(() => {});
if (TTS) { try { speechSynthesis.onvoiceschanged = () => {}; } catch (_) {} }
$('#menu').onclick = openSide;
$('#backdrop').onclick = closeSide;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSide(); });
routeNav();
</script>

</body></html>
